<html lang="en">
<head>

<body>
   
<nav class="navbar navbar-light topNav">

    <div class="imgCover">

<div class="loginSection">
  <div class="login-card">
      <h3>Login</h3>
      <img
        src="./assets/loginIcon.png"
        alt="Login illustration" id="loginIcon"
      />
      <div></div>

      <form>
        <div class="mb-3">
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Name"
            required
          />
        </div>
     
        <button type="submit" class="btn btn-start" onclick="login()" >Start</button>
     
      </form>
    </div>

</div>
